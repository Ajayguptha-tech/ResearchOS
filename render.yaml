services:
  - type: web
    name: researchos-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: researchos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: AI_PROVIDER
        value: local
      - key: EMAIL_PROVIDER
        value: console
      - key: CORS_ORIGINS
        value: "http://localhost:3000"

databases:
  - name: researchos-db
    plan: free
    region: oregon
    databaseName: researchos
    user: postgres
